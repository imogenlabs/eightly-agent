services:
  eightly-agent:
    # ghcr.io/imogenlabs/eightly-agent is unreachable while this repo/package is private (403).
    # smashingtags/eightly-agent on Docker Hub is the only image that pulls publicly today,
    # though it's stale (last published 2026-05-21) — see README.md Quick Start.
    image: smashingtags/eightly-agent:latest
    container_name: eightly-agent
    restart: unless-stopped
    # A second reaper for images built before EOS-2533 put tini in the image.
    init: true
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - agent-data:/data
    environment:
      - EIGHTLY_AGENT_SECRET=${EIGHTLY_AGENT_SECRET}
      - EIGHTLY_SERVER_URL=${EIGHTLY_SERVER_URL:-}
      - EIGHTLY_ENROLL_TOKEN=${EIGHTLY_ENROLL_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    # No healthcheck override: the image carries its own. An image built before
    # EOS-2533 has no `healthcheck` subcommand and would start a second agent
    # on every check if one were named here.

volumes:
  agent-data:
