# Docs site for docs/wiki, built by .github/workflows/docs.yml.
# Theme settings match the Eight.ly wiki so the two read as one product.
site_name: Eight.ly Agent
site_url: https://imogenlabs.github.io/eightly-agent/
site_author: Imogen Labs
site_description: "Eight.ly Agent: the small Go daemon that lets Eight.ly OS manage the Docker hosts it runs on."
use_directory_urls: true

repo_name: imogenlabs/eightly-agent
repo_url: https://github.com/imogenlabs/eightly-agent
edit_uri: edit/main/docs/wiki/
copyright: Eight.ly Agent is part of <a href="https://eight.ly">Eight.ly OS</a> by <a href="https://imogenlabs.ai">Imogen Labs</a>. Apache License 2.0.

docs_dir: docs/wiki
site_dir: site

# --strict turns these into build failures, broken #anchors included.
validation:
  links:
    anchors: warn

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - search.share
    - navigation.top
    - toc.integrate
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  icon:
    admonition:
      note: material/note-text
      tip: material/lightbulb-on
      warning: material/alert-circle
      info: material/information-outline
  font:
    text: Inter
    code: JetBrains Mono
  favicon: img/favicon.png
  logo: img/favicon.png

plugins:
  - search:
      lang: en

hooks:
  - docs/hooks/llms_txt.py

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://eight.ly
      name: Eight.ly
    - icon: fontawesome/brands/github
      link: https://github.com/imogenlabs/eightly-agent
      name: GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/Y9jbyrnTTj
      name: Discord
    - icon: fontawesome/solid/building
      link: https://imogenlabs.ai
      name: Imogen Labs

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: Installation.md
      - Upgrading: UPGRADING.md
      - Verifying Releases: Verifying-Releases.md
      - Configuration: Configuration.md
  - Core Concepts:
      - Architecture: Architecture.md
      - Security Model: Security-Model.md
      - Authentication: Authentication.md
      - Registration and Heartbeat: Registration-and-Heartbeat.md
      - TLS: TLS.md
  - Features:
      - API Reference: API-Reference.md
      - File Browser: File-Browser.md
      - WebSocket Console: WebSocket-Console.md
  - Help:
      - Troubleshooting: Troubleshooting.md
  - Contributing:
      - Development: Development.md
