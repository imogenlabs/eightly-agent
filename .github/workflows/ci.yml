name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    # Public repositories and fork pull requests use GitHub-hosted runners.
    runs-on: ${{ (github.event.repository.private != true || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON('["self-hosted","linux"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false  # Persistent self-hosted runners keep the Go cache on disk
          go-version: '1.26.10'
      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Go vet
        run: go vet ./...
      - name: Static check
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          # Pinned, like every tool here; "latest" changed what this gate checks
          # without a commit.
          version: "v0.8.2"
          # The action installs its own Go by default, so gosec below
          # was built by one Go and read another's stdlib ("package context
          # without types"). Use the Go set up above.
          install-go: false
      # The pinned tools go into a directory of this job's own and run by full
      # path. A bare name runs whatever copy comes first on PATH, so a runner
      # with its own golangci-lint ran that one instead, and runners disagreed
      # on findings (SA5011 on one only).
      - name: Install pinned lint tools
        run: |
          echo "TOOLS=$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
          export GOBIN="$RUNNER_TEMP/tools"
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          "$GOBIN/golangci-lint" --version
      - name: Govulncheck
        run: '"$TOOLS/govulncheck" ./...'
      - name: Gosec
        run: '"$TOOLS/gosec" ./...'
      - name: golangci-lint
        run: '"$TOOLS/golangci-lint" run ./...'

  test:
    name: Test
    # Public repositories and fork pull requests use GitHub-hosted runners.
    runs-on: ${{ (github.event.repository.private != true || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON('["self-hosted","linux"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false  # Persistent self-hosted runners keep the Go cache on disk
          go-version: '1.26.10'
      # The gate's own test runs first: it needs no toolchain output, and a
      # gate that can no longer tell its three outcomes apart must fail before
      # its verdict is trusted.
      - name: Coverage gate self-test
        run: scripts/coverage-check.sh --self-test
      # The tag and image-alias rules release.yml and docker-publish.yml share,
      # proven on a scratch repo here so a change to them is checked before a
      # tag ever runs them.
      - name: Release tag resolver self-test
        run: scripts/release-tag.sh --self-test
      - name: Run tests
        run: go test ./... -count=1 -race -timeout 60s -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
      # Whole-tree and per-package floors (the ratchet); raise them in
      # scripts/coverage-check.sh as coverage climbs. Exit 2 means no number was
      # produced (a suite that did not build, a floored package that was
      # renamed), which is not a coverage regression and is worded apart from
      # a breach. The dispatch is on the exact status.
      - name: Coverage gate
        run: |
          set +e
          scripts/coverage-check.sh coverage.out
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::error title=Coverage gate reached no verdict::No coverage number was produced, so nothing is known about coverage. This is NOT a floor breach; see the log for what failed to measure."
          elif [ "$rc" = "1" ]; then
            echo "::error title=Coverage below a floor::A package or the whole tree is below its floor in scripts/coverage-check.sh, or a package has no floor. See the table in the log."
          fi
          exit "$rc"

  windows-test:
    name: Test (Windows)
    # GitHub-hosted on every push and pull request, fork or not: no
    # self-hosted runner here runs Windows, and this is the only job that
    # exercises the named-pipe dialer and the Windows access-list and owner
    # checks for real. The runner is elevated, so the owner tests run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
      - name: Run tests
        run: go test ./... -count=1 -timeout 120s
      # Listed by name, so the log shows the pipe and owner tests ran rather
      # than skipped.
      - name: Named pipe and owner tests, verbose
        run: go test ./internal/dockerdial/ ./internal/winacl/ -count=1 -v -run "Pipe|Owner|Owned|Check|Protect"

  race:
    name: Race Detector
    # Public repositories and fork pull requests use GitHub-hosted runners.
    runs-on: ${{ (github.event.repository.private != true || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON('["self-hosted","linux"]') }}
    needs: [lint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false  # Persistent self-hosted runners keep the Go cache on disk
          go-version: '1.26.10'
      - name: Run tests with race detector
        run: go test ./... -race -count=1 -timeout 120s

  image-reaps:
    # The image ran with no init and a health check that orphaned a
    # helper on every timeout; 115,420 zombies piled up on a production host. This
    # builds the image and proves it reaps orphans and passes its own check.
    name: Image reaps orphaned processes
    # Only runners that a probe proved can build an image with buildx
    # AND run it carry `docker-build`. Some self-hosted runners cannot
    # start a container (runc: "open sysctl ... reopen fd 8: permission
    # denied"), so they do not carry it. Which runners do is recorded in
    # deploy-pipeline INFRASTRUCTURE.md, with the probe that decided it.
    # Public repositories and fork pull requests use GitHub-hosted runners.
    runs-on: ${{ fromJSON((github.event.repository.private != true || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '"ubuntu-latest"' || '["self-hosted", "docker-build"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Build image
        # The Dockerfile uses BuildKit's $BUILDPLATFORM, which the legacy
        # builder cannot parse. A runner without buildx cannot build it at all,
        # and that says nothing about the image.
        run: |
          if ! docker buildx version >/dev/null 2>&1; then
            echo "CANNOT CHECK: this runner has no docker buildx" >&2
            exit 2
          fi
          docker buildx build --load --build-arg VERSION=ci-${{ github.sha }} -t eightly-agent-reap:${{ github.run_id }} .
      - name: Check the image reaps orphans and passes its own health check
        run: scripts/check-image-reaps.sh eightly-agent-reap:${{ github.run_id }}
      - name: Remove the test image
        if: always()
        run: docker rmi -f eightly-agent-reap:${{ github.run_id }} || true

  e2e:
    # The built agent against a fake Eight.ly OS server and a real Docker
    # daemon: enrollment, signed-token API calls, the proxy's refusals, the
    # volume file browser and token renewal (test/e2e). Needs a runner that
    # can run containers, so the same `docker-build` label as image-reaps.
    name: End-to-end
    # Public repositories and fork pull requests use GitHub-hosted runners.
    runs-on: ${{ fromJSON((github.event.repository.private != true || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '"ubuntu-latest"' || '["self-hosted", "docker-build"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false  # Persistent self-hosted runners keep the Go cache on disk
          go-version: '1.26.10'
      - name: Docker is reachable
        run: docker version
      - name: End-to-end test
        env:
          EIGHTLY_E2E: '1'
        run: go test -tags e2e -count=1 -v -timeout 10m ./test/e2e/

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    # Public repositories and fork pull requests use GitHub-hosted runners.
    runs-on: ${{ (github.event.repository.private != true || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON('["self-hosted","linux"]') }}
    needs: [lint, test, race]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false  # Persistent self-hosted runners keep the Go cache on disk
          go-version: '1.26.10'
      - name: Build binary
        env:
          GOARM: ${{ matrix.goarm || '' }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.version=ci-${{ github.sha }}" \
            -o eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/agent/
      # A convenience copy; release.yml builds and uploads its own.
      # On a pull request the compile is the check, and a full org artifact
      # quota must never fail it.
      - name: Upload artifact
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          retention-days: 7
