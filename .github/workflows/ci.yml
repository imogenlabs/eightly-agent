name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false  # Persistent self-hosted runners keep the Go cache on disk
          go-version: '1.26.10'
      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Go vet
        run: go vet ./...
      - name: Static check
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: "latest"
          # The action installs its own Go by default, so gosec below
          # was built by one Go and read another's stdlib ("package context
          # without types"). Use the Go set up above.
          install-go: false
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
          gosec ./...
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          golangci-lint run ./...

  test:
    name: Test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false  # Persistent self-hosted runners keep the Go cache on disk
          go-version: '1.26.10'
      - name: Run tests
        run: go test ./... -count=1 -race -timeout 60s -coverprofile=coverage.out -covermode=atomic
      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
      - name: Check coverage threshold
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          if [ $(echo "$TOTAL < 50" | bc) -eq 1 ]; then
            echo "Coverage below 50% threshold"
            exit 1
          fi

  race:
    name: Race Detector
    runs-on: self-hosted
    needs: [lint]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false  # Persistent self-hosted runners keep the Go cache on disk
          go-version: '1.26.10'
      - name: Run tests with race detector
        run: go test ./... -race -count=1 -timeout 120s

  image-reaps:
    # The image ran with no init and a health check that orphaned a
    # helper on every timeout; 115,420 zombies piled up on a production host. This
    # builds the image and proves it reaps orphans and passes its own check.
    name: Image reaps orphaned processes
    # Only runners that a probe proved can build an image with buildx
    # AND run it carry `docker-build`. Some self-hosted runners cannot
    # start a container (runc: "open sysctl ... reopen fd 8: permission
    # denied"), so they do not carry it. Which runners do is recorded in
    # deploy-pipeline INFRASTRUCTURE.md, with the probe that decided it.
    runs-on: [self-hosted, docker-build]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build image
        # The Dockerfile uses BuildKit's $BUILDPLATFORM, which the legacy
        # builder cannot parse. A runner without buildx cannot build it at all,
        # and that says nothing about the image.
        run: |
          if ! docker buildx version >/dev/null 2>&1; then
            echo "CANNOT CHECK: this runner has no docker buildx" >&2
            exit 2
          fi
          docker buildx build --load --build-arg VERSION=ci-${{ github.sha }} -t eightly-agent-reap:${{ github.run_id }} .
      - name: Check the image reaps orphans and passes its own health check
        run: scripts/check-image-reaps.sh eightly-agent-reap:${{ github.run_id }}
      - name: Remove the test image
        if: always()
        run: docker rmi -f eightly-agent-reap:${{ github.run_id }} || true

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: self-hosted
    needs: [lint, test, race]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false  # Persistent self-hosted runners keep the Go cache on disk
          go-version: '1.26.10'
      - name: Build binary
        env:
          GOARM: ${{ matrix.goarm || '' }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.version=ci-${{ github.sha }}" \
            -o eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/agent/
      # A convenience copy; release.yml builds and uploads its own.
      # On a pull request the compile is the check, and a full org artifact
      # quota must never fail it.
      - name: Upload artifact
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          retention-days: 7
