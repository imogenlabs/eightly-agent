name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

# One publish at a time per stream, so two releases cannot race each other to
# `latest`. Release tags share one group; branch pushes queue per branch.
# Never cancel a publish that has started: it may already have pushed.
concurrency:
  group: docker-publish-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/imogenlabs/eightly-agent
  DOCKERHUB_IMAGE: smashingtags/eightly-agent

jobs:
  docker:
    name: Build & Push Multi-Arch
    # This job builds with buildx and signs with cosign on
    # the runner itself, so it needs a runner proven to do both: `docker-build`
    # (builds and runs an image) and `can-sign` (can reach Sigstore's Fulcio).
    # A runner that cannot reach Fulcio pushes the image and then fails to sign.
    # Org self-hosted runners do not serve public repositories, so a public repo
    # uses GitHub-hosted runners, which have Docker, buildx and Fulcio access.
    runs-on: ${{ github.event.repository.private == false && 'ubuntu-latest' || fromJSON('["self-hosted","docker-build","can-sign"]') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # every tag, for the `latest` check below
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # metadata-action's latest=auto tags every stable release push as
      # `latest`, so publishing an older release moved `latest` backwards.
      # Promote only the highest stable tag in the repo. Prereleases never.
      - name: Decide whether this release becomes latest
        id: latest
        run: |
          PROMOTE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            HIGHEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ "$GITHUB_REF_NAME" = "$HIGHEST" ]; then
              PROMOTE=true
            fi
            echo "This tag: $GITHUB_REF_NAME, highest stable tag: ${HIGHEST:-none}, promote latest: $PROMOTE"
          fi
          echo "promote=$PROMOTE" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ steps.latest.outputs.promote }}
          # `latest` comes only from the step above. main pushes produce
          # :main + :<sha> (a dev image), never :latest.
          flavor: |
            latest=false

      - name: Build and push
        id: docker
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign container images
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            cosign sign --yes "${tag}@${{ steps.docker.outputs.digest }}"
          done

      - name: Attest GHCR image provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-name: ghcr.io/imogenlabs/eightly-agent
          subject-digest: ${{ steps.docker.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub image provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-name: index.docker.io/smashingtags/eightly-agent
          subject-digest: ${{ steps.docker.outputs.digest }}
          push-to-registry: true
