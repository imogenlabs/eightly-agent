name: Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# One publish at a time per stream, so two releases cannot race each other to
# `latest`. Release tags share one group; branch pushes queue per branch.
# Never cancel a publish that has started: it may already have pushed.
concurrency:
  group: docker-publish-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/imogenlabs/eightly-agent
  DOCKERHUB_IMAGE: smashingtags/eightly-agent

jobs:
  # A release tag goes through the same check as release.yml
  # (scripts/release-tag.sh): semver, exists, on main. A tag that fails it is
  # never built, logged in for, signed or pushed. This job holds no secrets.
  resolve:
    name: Resolve commit and tags
    # Org self-hosted runners do not serve public repositories. `!= true`
    # rather than `== false`, so an event without the field goes to a runner
    # that exists.
    runs-on: ${{ github.event.repository.private != true && 'ubuntu-latest' || 'self-hosted' }}
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
      latest: ${{ steps.resolve.outputs.latest }}
      minor_alias: ${{ steps.resolve.outputs.minor_alias }}
      minor_tag: ${{ steps.resolve.outputs.minor_tag }}
      major_alias: ${{ steps.resolve.outputs.major_alias }}
      major_tag: ${{ steps.resolve.outputs.major_tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # every tag and origin/main, for the checks below
          persist-credentials: false
      - name: Resolver self-test
        run: scripts/release-tag.sh --self-test
      - name: Resolve
        id: resolve
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            scripts/release-tag.sh resolve "$GITHUB_REF_NAME" > resolved.txt
            cat resolved.txt
            echo "release=true" >> resolved.txt
          else
            # A branch push publishes :<branch> and :<sha> only, never an alias.
            {
              echo "sha=$GITHUB_SHA"
              echo "version=latest"
              echo "release=false"
              echo "latest=false"
              echo "minor_alias=false"
              echo "minor_tag=unused"
              echo "major_alias=false"
              echo "major_tag=unused"
            } > resolved.txt
          fi
          cat resolved.txt >> "$GITHUB_OUTPUT"

  docker:
    name: Build & Push Multi-Arch
    needs: resolve
    # This job builds with buildx and signs with cosign on
    # the runner itself, so it needs a runner proven to do both: `docker-build`
    # (builds and runs an image) and `can-sign` (can reach Sigstore's Fulcio).
    # A runner that cannot reach Fulcio pushes the image and then fails to sign.
    # Org self-hosted runners do not serve public repositories, so a public repo
    # uses GitHub-hosted runners, which have Docker, buildx and Fulcio access.
    runs-on: ${{ github.event.repository.private != true && 'ubuntu-latest' || fromJSON('["self-hosted","docker-build","can-sign"]') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # The resolved commit, checked out before any registry login.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Every alias comes from the resolver: `latest`, MAJOR.MINOR and MAJOR
      # each move only for the highest stable tag in their line, so
      # republishing an older release never moves one backwards, and a
      # prerelease gets its exact version only.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }},enable=${{ needs.resolve.outputs.release == 'true' }}
            type=raw,value=${{ needs.resolve.outputs.minor_tag }},enable=${{ needs.resolve.outputs.minor_alias == 'true' }}
            type=raw,value=${{ needs.resolve.outputs.major_tag }},enable=${{ needs.resolve.outputs.major_alias == 'true' }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.latest == 'true' }}
            type=ref,event=branch
            type=sha,prefix=
          # main pushes produce :main + :<sha> (a dev image), never :latest.
          flavor: |
            latest=false

      - name: Build and push
        id: docker
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign container images
        env:
          COSIGN_EXPERIMENTAL: "1"
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.docker.outputs.digest }}
        run: |
          printf '%s\n' "$TAGS" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Attest GHCR image provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-name: ghcr.io/imogenlabs/eightly-agent
          subject-digest: ${{ steps.docker.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub image provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-name: index.docker.io/smashingtags/eightly-agent
          subject-digest: ${{ steps.docker.outputs.digest }}
          push-to-registry: true
