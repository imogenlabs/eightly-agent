name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/agent/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}

  publish:
    name: Create Release
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Prepare release files
        run: |
          mkdir -p release
          cp dist/eightly-agent-linux-amd64/eightly-agent-linux-amd64 release/
          cp dist/eightly-agent-linux-arm64/eightly-agent-linux-arm64 release/
          chmod +x release/*
          cd release && sha256sum eightly-agent-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Eight.ly Agent ${{ steps.version.outputs.tag }}
          files: |
            release/eightly-agent-linux-amd64
            release/eightly-agent-linux-arm64
            release/SHA256SUMS
          body: |
            ## Eight.ly Agent ${{ steps.version.outputs.tag }}

            Lightweight Docker management agent for Eight.ly OS.

            ### Docker
            ```bash
            docker run -d \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -p 9001:9001 \
              ghcr.io/smashingtags/eightly-agent:${{ steps.version.outputs.version }}
            ```

            Also available on Docker Hub:
            ```bash
            docker pull smashingtags/eightly-agent:${{ steps.version.outputs.version }}
            ```

            ### Binary
            ```bash
            wget https://github.com/smashingtags/eightly-agent/releases/download/${{ steps.version.outputs.tag }}/eightly-agent-linux-amd64
            chmod +x eightly-agent-linux-amd64
            sudo mv eightly-agent-linux-amd64 /usr/bin/eightly-agent
            ```
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'beta') || contains(steps.version.outputs.tag, 'rc') }}
          generate_release_notes: true
