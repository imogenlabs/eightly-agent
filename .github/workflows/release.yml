name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.1.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.23'

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOARM: ${{ matrix.goarm || '' }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/agent/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  package:
    name: Package (${{ matrix.goarch }})
    runs-on: self-hosted
    needs: build
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.23'

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download linux binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: eightly-agent-linux-${{ matrix.goarch }}

      - name: Make binary executable
        run: chmod +x eightly-agent-linux-${{ matrix.goarch }}

      - name: Build .deb package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          envsubst < nfpm.yml > nfpm-resolved.yml
          nfpm package --config nfpm-resolved.yml --packager deb --target eightly-agent_${{ steps.version.outputs.version }}_${{ matrix.goarch }}.deb

      - name: Build .rpm package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          envsubst < nfpm.yml > nfpm-resolved.yml
          nfpm package --config nfpm-resolved.yml --packager rpm --target eightly-agent-${{ steps.version.outputs.version }}.${{ matrix.goarch }}.rpm

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eightly-agent-deb-${{ matrix.goarch }}
          path: eightly-agent_${{ steps.version.outputs.version }}_${{ matrix.goarch }}.deb

      - name: Upload .rpm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eightly-agent-rpm-${{ matrix.goarch }}
          path: eightly-agent-${{ steps.version.outputs.version }}.${{ matrix.goarch }}.rpm

  release:
    name: Create Release
    runs-on: self-hosted
    needs: [build, package]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/

      - name: Prepare release files
        run: |
          mkdir -p release
          cp dist/eightly-agent-linux-amd64/eightly-agent-linux-amd64 release/
          cp dist/eightly-agent-linux-arm64/eightly-agent-linux-arm64 release/
          cp dist/eightly-agent-linux-arm/eightly-agent-linux-arm release/
          cp dist/eightly-agent-darwin-amd64/eightly-agent-darwin-amd64 release/
          cp dist/eightly-agent-darwin-arm64/eightly-agent-darwin-arm64 release/
          cp dist/eightly-agent-windows-amd64/eightly-agent-windows-amd64.exe release/
          cp dist/eightly-agent-deb-amd64/*.deb release/
          cp dist/eightly-agent-deb-arm64/*.deb release/
          cp dist/eightly-agent-rpm-amd64/*.rpm release/
          cp dist/eightly-agent-rpm-arm64/*.rpm release/
          chmod +x release/eightly-agent-linux-* release/eightly-agent-darwin-*
          cd release && sha256sum * > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign release artifacts
        run: |
          for f in release/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sig|*.crt|*SHA256SUMS*|*sbom*) continue ;;
            esac
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.crt"
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release/sbom.spdx.json

      - name: Attest SBOM
        continue-on-error: true
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6 # v1
        with:
          subject-path: |
            release/eightly-agent-*
            release/eightly-agent_*.deb
          sbom-path: release/sbom.spdx.json

      - name: Generate build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: |
            release/eightly-agent-*
            release/eightly-agent_*.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Eight.ly Agent ${{ steps.version.outputs.tag }}
          files: release/*
          body: |
            ## Eight.ly Agent ${{ steps.version.outputs.tag }}

            Lightweight Docker management agent for Eight.ly OS.

            ### Docker
            ```bash
            docker run -d \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -p 9001:9001 \
              ghcr.io/smashingtags/eightly-agent:${{ steps.version.outputs.version }}
            ```

            Also available on Docker Hub:
            ```bash
            docker pull smashingtags/eightly-agent:${{ steps.version.outputs.version }}
            ```

            ### Binary Install

            **Linux (amd64):**
            ```bash
            wget https://github.com/smashingtags/eightly-agent/releases/download/${{ steps.version.outputs.tag }}/eightly-agent-linux-amd64
            chmod +x eightly-agent-linux-amd64
            sudo mv eightly-agent-linux-amd64 /usr/bin/eightly-agent
            ```

            **Linux (arm64):**
            ```bash
            wget https://github.com/smashingtags/eightly-agent/releases/download/${{ steps.version.outputs.tag }}/eightly-agent-linux-arm64
            chmod +x eightly-agent-linux-arm64
            sudo mv eightly-agent-linux-arm64 /usr/bin/eightly-agent
            ```

            **macOS (Apple Silicon):**
            ```bash
            curl -Lo eightly-agent https://github.com/smashingtags/eightly-agent/releases/download/${{ steps.version.outputs.tag }}/eightly-agent-darwin-arm64
            chmod +x eightly-agent
            sudo mv eightly-agent /usr/local/bin/eightly-agent
            ```

            **macOS (Intel):**
            ```bash
            curl -Lo eightly-agent https://github.com/smashingtags/eightly-agent/releases/download/${{ steps.version.outputs.tag }}/eightly-agent-darwin-amd64
            chmod +x eightly-agent
            sudo mv eightly-agent /usr/local/bin/eightly-agent
            ```

            **Windows (amd64):**
            ```powershell
            Invoke-WebRequest -Uri https://github.com/smashingtags/eightly-agent/releases/download/${{ steps.version.outputs.tag }}/eightly-agent-windows-amd64.exe -OutFile eightly-agent.exe
            ```

            ### Debian / Ubuntu (.deb)
            ```bash
            wget https://github.com/smashingtags/eightly-agent/releases/download/${{ steps.version.outputs.tag }}/eightly-agent_${{ steps.version.outputs.version }}_amd64.deb
            sudo dpkg -i eightly-agent_${{ steps.version.outputs.version }}_amd64.deb
            sudo systemctl enable --now eightly-agent
            ```

            ### RHEL / Fedora (.rpm)
            ```bash
            wget https://github.com/smashingtags/eightly-agent/releases/download/${{ steps.version.outputs.tag }}/eightly-agent-${{ steps.version.outputs.version }}.amd64.rpm
            sudo rpm -i eightly-agent-${{ steps.version.outputs.version }}.amd64.rpm
            sudo systemctl enable --now eightly-agent
            ```

            ### Homebrew (macOS / Linux)
            ```bash
            brew install smashingtags/tap/eightly-agent
            ```

            ### Scoop (Windows)
            ```powershell
            scoop bucket add eightly https://github.com/smashingtags/scoop-eightly
            scoop install eightly-agent
            ```
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'beta') || contains(steps.version.outputs.tag, 'rc') }}
          generate_release_notes: true
