name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.1.0)'
        required: true
        type: string

# Write access only where the release is signed and published.
permissions:
  contents: read

jobs:
  # Every later job builds from the commit this job resolves, never from the
  # ref the workflow happened to be dispatched from. A dispatch for v2.1.0 from
  # some branch still ships exactly what the v2.1.0 tag points at.
  resolve:
    name: Resolve release commit
    # Org self-hosted runners do not serve public repositories.
    runs-on: ${{ github.event.repository.private == false && 'ubuntu-latest' || 'self-hosted' }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag to a commit on main
        id: resolve
        # The dispatch input reaches the shell as data, never as script text.
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Not a release tag: '$TAG' (expected vX.Y.Z or vX.Y.Z-suffix)" >&2
            exit 1
          fi
          if ! SHA=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}"); then
            echo "Tag $TAG does not exist (or does not point at a commit). Push the tag first." >&2
            exit 1
          fi
          if ! git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
            echo "origin/main is missing from the checkout" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "Tag $TAG points at $SHA, which is not on main. Releases ship from main only." >&2
            exit 1
          fi
          echo "Releasing $TAG from $SHA"
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ github.event.repository.private == false && 'ubuntu-latest' || 'self-hosted' }}
    needs: resolve
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false  # Persistent self-hosted runners keep the Go cache on disk
          go-version: '1.26.10'

      - name: Build binary
        env:
          GOARM: ${{ matrix.goarm || '' }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.version=${{ needs.resolve.outputs.version }}" \
            -o eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} ./cmd/agent/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: eightly-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  package:
    name: Package (${{ matrix.goarch }})
    runs-on: ${{ github.event.repository.private == false && 'ubuntu-latest' || 'self-hosted' }}
    needs: [resolve, build]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false  # Persistent self-hosted runners keep the Go cache on disk
          go-version: '1.26.10'

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3

      - name: Download linux binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: eightly-agent-linux-${{ matrix.goarch }}

      - name: Make binary executable
        run: chmod +x eightly-agent-linux-${{ matrix.goarch }}

      - name: Build .deb package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # sed, not envsubst: gettext's envsubst is missing on some runners
          sed -e "s/\${VERSION}/${VERSION}/g" -e "s/\${GOARCH}/${GOARCH}/g" nfpm.yml > nfpm-resolved.yml
          # A bare `! grep` never fails a step under bash -e; exit on a match.
          if grep -nF "\${" nfpm-resolved.yml; then
            echo "nfpm-resolved.yml still has an unexpanded variable" >&2
            exit 1
          fi
          nfpm package --config nfpm-resolved.yml --packager deb --target eightly-agent_${{ needs.resolve.outputs.version }}_${{ matrix.goarch }}.deb

      - name: Build .rpm package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # sed, not envsubst: gettext's envsubst is missing on some runners
          sed -e "s/\${VERSION}/${VERSION}/g" -e "s/\${GOARCH}/${GOARCH}/g" nfpm.yml > nfpm-resolved.yml
          # A bare `! grep` never fails a step under bash -e; exit on a match.
          if grep -nF "\${" nfpm-resolved.yml; then
            echo "nfpm-resolved.yml still has an unexpanded variable" >&2
            exit 1
          fi
          nfpm package --config nfpm-resolved.yml --packager rpm --target eightly-agent-${{ needs.resolve.outputs.version }}.${{ matrix.goarch }}.rpm

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eightly-agent-deb-${{ matrix.goarch }}
          path: eightly-agent_${{ needs.resolve.outputs.version }}_${{ matrix.goarch }}.deb

      - name: Upload .rpm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eightly-agent-rpm-${{ matrix.goarch }}
          path: eightly-agent-${{ needs.resolve.outputs.version }}.${{ matrix.goarch }}.rpm

  release:
    name: Create Release
    # Signs every artifact with cosign on the runner, so it needs a
    # runner proven to reach Fulcio (see docker-publish.yml). GitHub-hosted
    # runners reach Fulcio and the OIDC token endpoint, so keyless signing
    # works there too.
    runs-on: ${{ github.event.repository.private == false && 'ubuntu-latest' || fromJSON('["self-hosted","can-sign"]') }}
    needs: [resolve, build, package]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/

      - name: Prepare release files
        run: |
          mkdir -p release
          cp dist/eightly-agent-linux-amd64/eightly-agent-linux-amd64 release/
          cp dist/eightly-agent-linux-arm64/eightly-agent-linux-arm64 release/
          cp dist/eightly-agent-linux-arm/eightly-agent-linux-arm release/
          cp dist/eightly-agent-darwin-amd64/eightly-agent-darwin-amd64 release/
          cp dist/eightly-agent-darwin-arm64/eightly-agent-darwin-arm64 release/
          cp dist/eightly-agent-windows-amd64/eightly-agent-windows-amd64.exe release/
          cp dist/eightly-agent-deb-amd64/*.deb release/
          cp dist/eightly-agent-deb-arm64/*.deb release/
          cp dist/eightly-agent-rpm-amd64/*.rpm release/
          cp dist/eightly-agent-rpm-arm64/*.rpm release/
          chmod +x release/eightly-agent-linux-* release/eightly-agent-darwin-*
          cd release && sha256sum -- * > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign release artifacts
        run: |
          for f in release/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sig|*.crt|*SHA256SUMS*|*sbom*) continue ;;
            esac
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.crt"
          done

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release/sbom.spdx.json

      - name: Attest SBOM
        continue-on-error: true
        uses: actions/attest-sbom@5026d3663739160db546203eeaffa6aa1c51a4d6 # v1
        with:
          subject-path: |
            release/eightly-agent-*
            release/eightly-agent_*.deb
          sbom-path: release/sbom.spdx.json

      - name: Generate build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: |
            release/eightly-agent-*
            release/eightly-agent_*.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: Eight.ly Agent ${{ needs.resolve.outputs.tag }}
          files: release/*
          body: |
            ## Eight.ly Agent ${{ needs.resolve.outputs.tag }}

            Lightweight Docker management agent for Eight.ly OS.

            ### Docker
            Eight.ly OS writes this command for you, with a one-time enrollment token, under **Environments → Add host**. By hand:
            ```bash
            docker run -d --init --name eightly-agent --restart unless-stopped \
              -v /var/run/docker.sock:/var/run/docker.sock \
              --group-add "$(stat -c %g /var/run/docker.sock)" \
              -v eightly-agent-data:/data \
              -p 9001:9001 \
              -e EIGHTLY_AGENT_SECRET="your-shared-secret" \
              -e EIGHTLY_SERVER_URL="https://your-eos-server:8080" \
              -e EIGHTLY_ENROLL_TOKEN="your-enrollment-token" \
              ghcr.io/imogenlabs/eightly-agent:${{ needs.resolve.outputs.version }}
            ```

            ### Binary Install

            **Linux (amd64):**
            ```bash
            wget https://github.com/imogenlabs/eightly-agent/releases/download/${{ needs.resolve.outputs.tag }}/eightly-agent-linux-amd64
            chmod +x eightly-agent-linux-amd64
            sudo mv eightly-agent-linux-amd64 /usr/bin/eightly-agent
            ```

            **Linux (arm64):**
            ```bash
            wget https://github.com/imogenlabs/eightly-agent/releases/download/${{ needs.resolve.outputs.tag }}/eightly-agent-linux-arm64
            chmod +x eightly-agent-linux-arm64
            sudo mv eightly-agent-linux-arm64 /usr/bin/eightly-agent
            ```

            **macOS (Apple Silicon):**
            ```bash
            curl -Lo eightly-agent https://github.com/imogenlabs/eightly-agent/releases/download/${{ needs.resolve.outputs.tag }}/eightly-agent-darwin-arm64
            chmod +x eightly-agent
            sudo mv eightly-agent /usr/local/bin/eightly-agent
            ```

            **macOS (Intel):**
            ```bash
            curl -Lo eightly-agent https://github.com/imogenlabs/eightly-agent/releases/download/${{ needs.resolve.outputs.tag }}/eightly-agent-darwin-amd64
            chmod +x eightly-agent
            sudo mv eightly-agent /usr/local/bin/eightly-agent
            ```

            **Windows (amd64):**
            ```powershell
            Invoke-WebRequest -Uri https://github.com/imogenlabs/eightly-agent/releases/download/${{ needs.resolve.outputs.tag }}/eightly-agent-windows-amd64.exe -OutFile eightly-agent.exe
            ```

            ### Debian / Ubuntu (.deb)
            ```bash
            wget https://github.com/imogenlabs/eightly-agent/releases/download/${{ needs.resolve.outputs.tag }}/eightly-agent_${{ needs.resolve.outputs.version }}_amd64.deb
            sudo dpkg -i eightly-agent_${{ needs.resolve.outputs.version }}_amd64.deb
            sudo systemctl enable --now eightly-agent
            ```

            ### RHEL / Fedora (.rpm)
            ```bash
            wget https://github.com/imogenlabs/eightly-agent/releases/download/${{ needs.resolve.outputs.tag }}/eightly-agent-${{ needs.resolve.outputs.version }}.amd64.rpm
            sudo rpm -i eightly-agent-${{ needs.resolve.outputs.version }}.amd64.rpm
            sudo systemctl enable --now eightly-agent
            ```

            ### Homebrew (macOS / Linux)
            ```bash
            brew install imogenlabs/tap/eightly-agent
            ```

            ### Scoop (Windows)
            ```powershell
            scoop bucket add eightly https://github.com/imogenlabs/scoop-eightly
            scoop install eightly-agent
            ```
          draft: false
          prerelease: ${{ contains(needs.resolve.outputs.tag, 'beta') || contains(needs.resolve.outputs.tag, 'rc') }}
          generate_release_notes: true
