name: Jira release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to record
        required: true

permissions:
  contents: read

jobs:
  jira:
    runs-on: ${{ github.event.repository.private != true && 'ubuntu-latest' || 'self-hosted' }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      JIRA_PROJECT: ${{ vars.JIRA_PROJECT }}
      KEEN_REF: 12202a7b4122c7e39c8e66800ca6794b87a134e9  # keen v1.9.0
    steps:
      - name: Check Jira configuration
        id: creds
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "$JIRA_PROJECT" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "Skipped Jira release recording: JIRA_PROJECT is not set." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$JIRA_BASE_URL" ] || [ -z "$JIRA_USER" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "Not recorded in Jira (credentials are not configured). Run: \`keen release sync --repo-path <checkout of imogenlabs/eightly-agent> --project \"$JIRA_PROJECT\" --tag $TAG --head origin/main\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.have == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - if: steps.creds.outputs.have == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: imogenlabs/keen
          ref: ${{ env.KEEN_REF }}
          path: .keen-src
          persist-credentials: false
      - if: steps.creds.outputs.have == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .keen-src/go.mod
          cache: false
      - name: Build keen
        if: steps.creds.outputs.have == 'true'
        run: cd .keen-src && go build -o "$RUNNER_TEMP/keen" ./cmd/keen
      - name: Record ${{ env.TAG }} in Jira
        if: steps.creds.outputs.have == 'true'
        env:
          JIRA_PP_CLI_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_CLOUD_PLATFORM_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_CLOUD_PLATFORM_USERNAME: ${{ secrets.JIRA_USER }}
          JIRA_CLOUD_PLATFORM_PASSWORD: ${{ secrets.JIRA_API_TOKEN }}
        run: >-
          "$RUNNER_TEMP/keen" release sync --repo-path . --project "$JIRA_PROJECT"
          --tag "$TAG" --head origin/main --github-repo imogenlabs/eightly-agent

