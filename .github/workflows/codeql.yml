name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

# EOS-2462: a permissions block replaces the default scopes, so contents: read
# must be named or checkout of this private repo is refused ("repository not
# found") -- which is how this scan failed every week from August unseen.
permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # EOS-2462: set Go up from go.mod and build explicitly. autobuild used
      # whatever Go the runner happened to have, so the scan passed or failed
      # by which machine drew it.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3
        with:
          languages: go
          build-mode: manual
      - name: Build
        run: go build ./...
      # EOS-2462: code scanning upload needs GitHub Advanced Security, which a
      # private repo on the free plan does not have ("Advanced Security must be
      # enabled"). Keep the results here and fail the job on any finding, so the
      # scan is a real gate instead of a weekly red nobody reads.
      - uses: github/codeql-action/analyze@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3
        with:
          upload: never
          output: codeql-results
      - name: Fail on any CodeQL finding
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = glob.glob("codeql-results/*.sarif")
          if not files:
              print("CANNOT CHECK: CodeQL wrote no SARIF file"); sys.exit(2)
          n = 0
          for f in files:
              for run in json.load(open(f)).get("runs", []):
                  for r in run.get("results", []):
                      n += 1
                      loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                      path = loc.get("artifactLocation", {}).get("uri", "?")
                      line = loc.get("region", {}).get("startLine", "?")
                      print(f"{path}:{line}: {r.get('ruleId')}: {r.get('message', {}).get('text', '')}")
          print(f"CodeQL findings: {n} in {len(files)} SARIF file(s)")
          sys.exit(1 if n else 0)
          PY
