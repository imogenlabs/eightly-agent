name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

# A permissions block replaces the default scopes, so contents: read
# is declared explicitly for checkout and analysis.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # Some self-hosted runners have no `file` program, so CodeQL cannot
    # find the Go binary there and extracts nothing ("could not process any
    # code written in Go"). The code-quality runners have it.
    # Public repositories and fork pull requests use GitHub-hosted runners.
    runs-on: ${{ fromJSON((github.event.repository.private != true || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && '"ubuntu-latest"' || '["self-hosted", "code-quality"]') }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Set Go up from go.mod and build explicitly. autobuild used
      # whatever Go the runner happened to have, so the scan passed or failed
      # by which machine drew it. setup-go v5 installed the `go` line (an
      # older Go) and left the `toolchain` line to a download at build time;
      # v6 and later install the toolchain line and set GOTOOLCHAIN=local.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go is the go.mod toolchain
        run: |
          want="$(sed -n 's/^toolchain //p' go.mod)"
          want="${want:-go$(sed -n 's/^go //p' go.mod)}"
          got="$(go env GOVERSION)"
          echo "go.mod asks for $want; building with $got"
          test "$got" = "$want"
      - uses: github/codeql-action/init@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          languages: go
          build-mode: manual
      - name: Build
        run: go build ./...
      # Keep SARIF artifacts and fail the job on findings.
      - uses: github/codeql-action/analyze@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        with:
          upload: never
          output: codeql-results
          # The code-quality runners are 4 GB containers with no swap. Left to
          # size itself, CodeQL asks for --ram=3891, the kernel kills it, and
          # the runner goes down with it ("received a shutdown signal"). This
          # repo's database is small; 2 GB is plenty and leaves room.
          ram: 2048
          threads: 2
      - name: Fail on any CodeQL finding
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = glob.glob("codeql-results/*.sarif")
          if not files:
              print("CANNOT CHECK: CodeQL wrote no SARIF file"); sys.exit(2)
          n = 0
          for f in files:
              for run in json.load(open(f)).get("runs", []):
                  for r in run.get("results", []):
                      n += 1
                      loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                      path = loc.get("artifactLocation", {}).get("uri", "?")
                      line = loc.get("region", {}).get("startLine", "?")
                      print(f"{path}:{line}: {r.get('ruleId')}: {r.get('message', {}).get('text', '')}")
          print(f"CodeQL findings: {n} in {len(files)} SARIF file(s)")
          sys.exit(1 if n else 0)
          PY
