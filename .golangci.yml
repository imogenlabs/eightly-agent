run:
  timeout: 5m
  go: '1.23'

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - noctx

linters-settings:
  errcheck:
    exclude-functions:
      - (io.Closer).Close
      - (*os.File).Close
      - (net.Conn).Close
      - (*github.com/gorilla/websocket.Conn).Close
      - (*net/http.Response.Body).Close
      - os.Unsetenv
      - (net/http.ResponseWriter).Write
      - encoding/json.(*Encoder).Encode
      - encoding/pem.Encode

issues:
  exclude-use-default: false
